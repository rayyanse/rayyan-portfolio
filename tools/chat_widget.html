<button class="chat-bubble" id="chatBubble" aria-label="Chat with Rayyan's AI assistant">
  <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 5.9 2 10.7c0 2.7 1.4 5.1 3.7 6.7-.2 1.5-.8 2.8-1.7 3.8 1.7-.2 3.3-.9 4.7-1.9 1.1.3 2.2.5 3.3.5 5.5 0 10-3.9 10-8.7S17.5 2 12 2z"/></svg>
  <span class="chat-notif" id="chatNotif"></span>
</button>

<div class="chat-panel" id="chatPanel" role="dialog" aria-label="AI assistant">
  <div class="chat-header">
    <div class="chat-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M8 14h.01M16 14h.01"/></svg></div>
    <div class="chat-header-info">
      <div class="chat-header-name">Rayyan's Assistant</div>
      <div class="chat-header-status">Online</div>
    </div>
    <button class="chat-close" id="chatClose" aria-label="Close chat">&times;</button>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-suggestions" id="chatSuggestions">
    <button class="suggestion">What can you build for me?</button>
    <button class="suggestion">Tell me about Jennifer AI</button>
    <button class="suggestion">How much does a project cost?</button>
  </div>
  <div class="chat-input-row">
    <textarea id="chatInput" rows="1" maxlength="1000" placeholder="Ask about Rayyan's work..."></textarea>
    <button class="chat-send" id="chatSend" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z"/></svg></button>
  </div>
</div>
